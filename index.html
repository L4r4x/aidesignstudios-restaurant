<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aidesignstudios — Design für Food Startups</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23D4F06D%22/><text y=%22.9em%22 x=%2250%25%22 font-size=%2265%22 font-weight=%22900%22 font-family=%22Inter, Arial, sans-serif%22 text-anchor=%22middle%22 fill=%22black%22>ai</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --lime: #D4F06D;
            --lime-dark: #B8D64A;
            --lime-glow: rgba(212, 240, 109, 0.35);
            --ink: #111111;
            --slate-soft: #64748b;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'DM Sans', sans-serif; 
            -webkit-font-smoothing: antialiased; 
            overflow-x: hidden;
            color: var(--ink);
            background: #fff;
        }

        .font-serif { font-family: 'Playfair Display', serif; }
        html { scroll-behavior: smooth; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f8f9fa; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }

        ::selection { background: var(--lime); color: black; }

        /* Scroll Reveal */
        .reveal {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1), transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .reveal-delay-1 { transition-delay: 0.1s; }
        .reveal-delay-2 { transition-delay: 0.2s; }
        .reveal-delay-3 { transition-delay: 0.3s; }
        .reveal-delay-4 { transition-delay: 0.45s; }

        /* Image containers */
        .img-zoom-container {
            overflow: hidden;
            border-radius: 2rem;
            min-height: 280px;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .img-zoom-container img {
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .img-zoom-container:hover img {
            transform: scale(1.06);
        }

        /* Lime accent line */
        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--lime-dark);
        }
        .section-label::before {
            content: '';
            display: block;
            width: 20px;
            height: 2px;
            background: var(--lime-dark);
            border-radius: 2px;
        }

        /* Service cards */
        .service-card {
            border-radius: 2.5rem;
            border: 1.5px solid #f1f5f9;
            background: rgba(248,250,252,0.5);
            transition: border-color 0.4s ease, box-shadow 0.4s ease, background 0.4s ease;
        }
        .service-card:hover {
            border-color: rgba(212, 240, 109, 0.5);
            box-shadow: 0 30px 60px -20px rgba(184,214,74,0.15);
            background: white;
        }

        /* CTA Button pulse */
        @keyframes pulse-lime {
            0%, 100% { box-shadow: 0 20px 40px -10px rgba(212,240,109,0.4); }
            50% { box-shadow: 0 24px 50px -8px rgba(212,240,109,0.65); }
        }
        .cta-btn {
            animation: pulse-lime 3s ease-in-out infinite;
        }
        .cta-btn:hover {
            animation: none;
            box-shadow: 0 24px 60px -8px rgba(212,240,109,0.8);
        }

        /* Testimonial */
        .testimonial-card {
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.5s ease;
        }
        .testimonial-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.1);
        }

        /* Step cards */
        .step-card {
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.5s ease, background 0.4s ease;
        }
        .step-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 40px 70px -20px rgba(0,0,0,0.1);
            background: white !important;
        }

        /* Ambient animated blobs */
        @keyframes blobDrift1 {
            0%   { transform: translate(0, 0) scale(1); }
            33%  { transform: translate(60px, -40px) scale(1.08); }
            66%  { transform: translate(-30px, 50px) scale(0.95); }
            100% { transform: translate(0, 0) scale(1); }
        }
        @keyframes blobDrift2 {
            0%   { transform: translate(0, 0) scale(1); }
            33%  { transform: translate(-70px, 30px) scale(1.1); }
            66%  { transform: translate(40px, -60px) scale(0.92); }
            100% { transform: translate(0, 0) scale(1); }
        }
        @keyframes blobDrift3 {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(50px, 40px) scale(1.05); }
            100% { transform: translate(0, 0) scale(1); }
        }
        .blob {
            position: fixed;
            border-radius: 50%;
            background: #D4F06D;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
            mix-blend-mode: multiply;
        }
        .blob-1 {
            width: 320px; height: 320px;
            top: -60px; right: -40px;
            opacity: 0.13;
            animation: blobDrift1 18s ease-in-out infinite;
        }
        .blob-2 {
            width: 260px; height: 260px;
            bottom: 20%; left: -60px;
            opacity: 0.12;
            animation: blobDrift2 22s ease-in-out infinite;
        }
        .blob-3 {
            width: 220px; height: 220px;
            top: 45%; right: 15%;
            opacity: 0.10;
            animation: blobDrift3 26s ease-in-out infinite;
        }

        /* Grain overlay for hero */
        .grain::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            mix-blend-mode: overlay;
            opacity: 0.4;
        }

        /* Mobile menu */
        .mobile-menu-overlay {
            animation: slideIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Nav link underline */
        .nav-link {
            position: relative;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--lime-dark);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .nav-link:hover::after { width: 100%; }

        /* Floating badge */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .float-badge { animation: float 4s ease-in-out infinite; }

        /* About value cards */
        .value-card {
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .value-card:hover {
            transform: translateX(6px);
            border-color: var(--lime) !important;
            background: rgba(212, 240, 109, 0.05) !important;
        }

        /* Dotted bg pattern */
        .dot-bg {
            background-image: radial-gradient(circle, #e2e8f0 1px, transparent 1px);
            background-size: 32px 32px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ArrowRight = ({ size = 14, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        );
        const Check = ({ size = 16, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>
        );
        const Mail = ({ size = 28, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        );
        const Menu = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        );
        const X = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        );
        const Instagram = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
        );

        // Scroll reveal hook
        const useReveal = () => {
            useEffect(() => {
                const observer = new IntersectionObserver(
                    (entries) => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }),
                    { threshold: 0.12, rootMargin: '0px 0px -40px 0px' }
                );
                document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, []);
        };

        const App = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            useReveal();

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 60);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const services = [
                {
                    num: '01', emoji: '📊', title: 'Visual Fundraising',
                    desc: 'Ich gestalte überzeugende Pitch-Decks, die deine Zahlen und Vision so präsentieren, dass Investoren den Wert sofort erkennen.',
                    details: ['Investor-Ready Decks', 'Finanz-Visualisierung', 'Storytelling Assets'],
                    img: 'Example_Pitchdeck.png', imgAlt: 'Pitchdeck Design Beispiel', imgRight: true
                },
                {
                    num: '02', emoji: '📦', title: 'Retail Readiness',
                    desc: 'Ich erstelle fotorealistische 3D-Mockups und Verpackungsdesigns, die im Regal sofort auffallen und dein Produkt unwiderstehlich machen.',
                    details: ['Shelf-Impact Analysen', 'Regal-Simulationen', '3D-Produkt-Szenen'],
                    img: 'Example_Mockup.jpg', imgAlt: 'Verpackungs & Flaschen Design', imgRight: false
                },
                {
                    num: '03', emoji: '📱', title: 'Digital Growth',
                    desc: 'Ich kreiere ästhetischen Content, der deine Community hungrig macht und deine Genuss-Marke digital wachsen lässt.',
                    details: ['Reels & Stills', 'Brand Storytelling', 'Gründer-Content'],
                    img: 'Example_Socialmedia.gif', imgAlt: 'Social Media Content Beispiel', imgRight: true
                }
            ];

            return (
                <div className="min-h-screen bg-white text-slate-900">

                <div className="blob blob-1" />
                <div className="blob blob-2" />
                <div className="blob blob-3" />

                    {/* ── Navigation ── */}
                    <nav className={`fixed w-full z-50 transition-all duration-500 ${scrolled ? 'bg-white/92 backdrop-blur-xl py-3 shadow-[0_1px_0_0_rgba(0,0,0,0.06)]' : 'bg-transparent py-5'}`}>
                        <div className="max-w-7xl mx-auto px-6 md:px-10 flex justify-between items-center">
                            <a href="#" className="flex items-center gap-2.5">
                                <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <rect width="36" height="36" rx="10" fill="#D4F06D"/>
                                    <text x="18" y="25" textAnchor="middle" fontFamily="Playfair Display, Georgia, serif" fontWeight="700" fontStyle="italic" fontSize="17" fill="#111111">ai</text>
                                </svg>
                                <span className="text-base font-bold tracking-tight uppercase text-slate-950">
                                    design<span className="text-[#B8D64A]">studios</span>
                                </span>
                            </a>
                            
                            <div className="hidden md:flex items-center gap-10">
                                {[['#angebote','Angebote'],['#bezahlung','Bezahlung'],['#uebermich','Über mich']].map(([href, label]) => (
                                    <a key={href} href={href} className="nav-link text-xs font-semibold uppercase tracking-widest text-slate-600 hover:text-slate-950 transition-colors">{label}</a>
                                ))}
                                <a href="#kontakt" className="bg-[#D4F06D] text-black px-6 py-2.5 rounded-full text-xs font-bold uppercase tracking-widest flex items-center gap-2 hover:bg-[#B8D64A] transition-all shadow-sm hover:shadow-md">
                                    Projekt starten <ArrowRight />
                                </a>
                            </div>
                            
                            <button className="md:hidden p-2 rounded-xl hover:bg-slate-50 transition-colors" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                {isMenuOpen ? <X /> : <Menu />}
                            </button>
                        </div>
                    </nav>

                    {/* ── Hero ── */}
                    <header className="relative min-h-screen flex items-center pt-24 pb-12 overflow-hidden bg-white grain">
                        {/* Background glow handled by global blobs */}

                        <div className="max-w-7xl mx-auto px-6 md:px-10 grid lg:grid-cols-12 gap-12 lg:gap-20 items-center w-full">
                            <div className="lg:col-span-7 flex flex-col items-center md:items-start relative z-10">
                                
                                <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-slate-50 border border-slate-100 text-[10px] font-bold uppercase tracking-[0.25em] mb-10 text-slate-500 reveal">
                                    <span className="w-1.5 h-1.5 rounded-full bg-[#B8D64A] animate-pulse"></span>
                                    Für Food- und Getränke-Startups
                                </div>
                                
                                <h1 className="text-5xl md:text-6xl lg:text-[5vw] leading-[1.08] font-serif font-bold tracking-tight mb-6 text-center md:text-left reveal reveal-delay-1">
                                    Ich mache deine<br />
                                    Food-Vision<br />
                                    <span style={{color:'#B8D64A'}}>marktreif.</span>
                                </h1>
                                
                                <p className="text-2xl md:text-3xl lg:text-[2.5vw] leading-[1.25] font-serif italic text-slate-300 mb-8 tracking-tight text-center md:text-left reveal reveal-delay-2">
                                    Du zahlst,<br className="hidden md:block" /> was es dir wert ist.
                                </p>
                                
                                <p className="text-base lg:text-[1.1vw] text-slate-500 max-w-lg leading-relaxed font-normal mb-10 text-center md:text-left reveal reveal-delay-3">
                                    Vom ersten Design bis zum fertigen Produkt im Regal. Ich entwerfe Verpackungsdesigns, Pitch-Decks und Social-Media Content, die wirklich verkaufen.
                                </p>

                                <div className="flex flex-col sm:flex-row gap-4 w-full sm:w-auto text-center reveal reveal-delay-4">
                                    <a href="#angebote" className="bg-[#D4F06D] text-black px-10 py-5 rounded-full text-sm font-bold flex items-center justify-center gap-2.5 hover:bg-[#B8D64A] transition-all group shadow-xl shadow-lime-100/60 hover:shadow-lime-200/60 hover:-translate-y-0.5 active:translate-y-0">
                                        Angebote entdecken <ArrowRight size={18} className="group-hover:translate-x-1 transition-transform" />
                                    </a>
                                    <a href="#bezahlung" className="border-2 border-slate-150 text-slate-600 px-10 py-5 rounded-full text-sm font-bold hover:bg-slate-50 hover:border-slate-200 transition-all flex items-center justify-center hover:-translate-y-0.5 active:translate-y-0">
                                        Wie funktioniert's?
                                    </a>
                                </div>
                            </div>

                            <div className="lg:col-span-5 relative flex justify-center lg:justify-end reveal reveal-delay-2">
                                <div className="relative z-10 w-full max-w-[420px]">
                                    <div className="shadow-[0_50px_100px_-20px_rgba(0,0,0,0.18)] rounded-[3rem] overflow-hidden border-8 border-white transform lg:rotate-2 hover:rotate-0 transition-transform duration-700">
                                        <img src="Example_Header.jpg" alt="Food Branding Beispiel" className="w-full h-auto block" />
                                    </div>
                                    
                                    <div className="float-badge absolute -bottom-6 -left-6 bg-white px-5 py-4 rounded-2xl shadow-2xl border border-slate-50 hidden md:flex items-center gap-3">
                                        <span className="w-2.5 h-2.5 rounded-full bg-[#B8D64A] animate-pulse"></span>
                                        <span className="text-[11px] font-black uppercase tracking-widest text-[#B8D64A]">Retail-Ready</span>
                                    </div>
                                    
                                    <div className="absolute -top-4 -right-4 bg-[#D4F06D] text-black px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-wider hidden md:block shadow-lg">
                                        Food & Drinks ✦
                                    </div>
                                </div>
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-[#D4F06D] opacity-[0.12] blur-[100px] -z-10 rounded-full"></div>
                            </div>
                        </div>

                        {/* Scroll indicator */}
                        <div className="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 text-slate-300 hidden md:flex">
                            <span className="text-[9px] font-bold uppercase tracking-[0.35em]">Scroll</span>
                            <div className="w-px h-12 bg-gradient-to-b from-slate-200 to-transparent"></div>
                        </div>
                    </header>

                    {/* ── Services ── */}
                    <section id="angebote" className="py-24 bg-white border-t border-slate-50">
                        <div className="max-w-7xl mx-auto px-6 md:px-10">
                            <div className="mb-16 text-center md:text-left reveal">
                                <span className="section-label mb-4 block">MEINE SERVICES</span>
                                <h2 className="text-4xl lg:text-5xl font-serif font-bold tracking-tight mb-2 leading-tight text-slate-900">Wie ich dich unterstütze.</h2>
                                <p className="text-2xl lg:text-3xl font-serif italic text-slate-300 font-medium leading-none">Von der Idee bis zum fertigen Design.</p>
                            </div>

                            <div className="flex flex-col gap-10">
                                {services.map((s, i) => (
                                    <div key={s.num} className={`grid md:grid-cols-12 gap-8 items-stretch reveal reveal-delay-${i+1}`}>
                                        {!s.imgRight && (
                                            <div className="md:col-span-4">
                                                <div className="img-zoom-container shadow-lg border border-slate-100 h-full aspect-[4/5]">
                                                    <img src={s.img} alt={s.imgAlt} />
                                                </div>
                                            </div>
                                        )}
                                        <div className={s.imgRight ? 'md:col-span-7' : 'md:col-span-8'}>
                                            <div className="service-card p-10 lg:p-12 relative overflow-hidden h-full flex flex-col justify-center">
                                                <div className="absolute top-8 right-10 text-sm font-bold text-[#B8D64A] uppercase tracking-widest opacity-30 font-serif italic">{s.num}</div>
                                                <div className="flex flex-col lg:flex-row lg:items-center gap-8 lg:gap-12 text-slate-900">
                                                    <div className="flex-1">
                                                        <div className="text-5xl mb-6">{s.emoji}</div>
                                                        <h3 className="text-2xl font-serif font-bold mb-3 tracking-tight">{s.title}</h3>
                                                        <p className="text-slate-500 text-lg leading-relaxed max-w-md">{s.desc}</p>
                                                    </div>
                                                    <div className="lg:w-[220px] border-l-2 border-slate-100 lg:pl-8">
                                                        <div className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-4">DETAILS</div>
                                                        <ul className="space-y-3">
                                                            {s.details.map(item => (
                                                                <li key={item} className="flex items-start gap-3 text-sm font-semibold text-slate-700">
                                                                    <Check className="text-[#B8D64A] shrink-0 mt-0.5" /> {item}
                                                                </li>
                                                            ))}
                                                        </ul>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        {s.imgRight && (
                                            <div className="md:col-span-5">
                                                <div className="img-zoom-container shadow-lg border border-slate-100 h-full">
                                                    <img src={s.img} alt={s.imgAlt} />
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* ── Pricing ── */}
                    <section id="bezahlung" className="py-24 bg-slate-50 relative overflow-hidden border-t border-slate-100">

                        <div className="max-w-7xl mx-auto px-6 md:px-10 text-center relative z-10">
                            <div className="mb-14 reveal">
                                <span className="section-label mb-5 block justify-center">MEIN MODELL</span>
                                <h2 className="text-4xl lg:text-6xl font-serif font-bold tracking-tight mb-3 leading-none text-slate-900">Pay as much<br className="hidden md:block" /> as you want.</h2>
                                <p className="text-2xl font-serif italic font-medium tracking-tight text-slate-400 mt-3">Fairness & Vertrauen.</p>
                            </div>

                            <div className="reveal reveal-delay-1">
                                <p className="text-2xl md:text-3xl text-slate-400 max-w-2xl mx-auto mt-6 font-normal leading-relaxed italic border-x border-slate-100 px-8 opacity-80">
